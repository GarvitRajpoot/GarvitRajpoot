name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: GarvitRajpoot
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=9D4EDD&color_dots=#161B22,#3D0066,#6A00A8,#9D4EDD,#C77DFF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

